<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account JSON Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    background:#0d0f12;
    color:#e1e7ed;

    font-family:Arial,sans-serif;

    padding:40px 20px;

    max-width:720px;

    margin:auto;

}



h2{

    color:white;

    margin-bottom:8px;

}



p{

    color:#8b949e;

    margin-bottom:15px;

}



textarea{

    width:100%;

    height:180px;

    background:#161b22;

    color:#00ffaa;

    border:1px solid #30363d;

    border-radius:12px;

    padding:14px;

    font-size:15px;

    font-family:monospace;

    outline:none;

}



textarea:focus{

    border-color:#0099ff;

}




/* UPLOAD */

.upload-box{

    margin-top:15px;

}



.upload-box label{


    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;


    height:160px;


    background:

    linear-gradient(
        135deg,
        #161b22,
        #0f141a
    );


    border:2px dashed #0099ff;

    border-radius:18px;


    cursor:pointer;

    transition:.3s;

}



.upload-box label:hover{

    border-color:#00ffaa;

    transform:translateY(-3px);

}



.upload-icon{

    font-size:42px;

}



.upload-title{

    color:white;

    font-size:18px;

    font-weight:bold;

    margin-top:10px;

}



.upload-desc{

    color:#8b949e;

    font-size:13px;

    margin-top:5px;

}



#fileName{

    margin-top:10px;

    color:#00ffaa;

    font-size:14px;

}





/* BUTTON */

.button-group{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-top:20px;

    margin-bottom:25px;

}




button{

    padding:12px 20px;

    background:#0099ff;

    color:white;

    border:0;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;

}



button:hover{

    opacity:.8;

}



button:nth-child(2){

    background:#238636;

}



button:nth-child(3){

    background:#8957e5;

}




#count{

    color:#00ffaa;

    font-weight:bold;

    margin-bottom:10px;

}




pre{

    background:#090d11;

    color:#00ffaa;

    padding:16px;

    border-radius:12px;

    border:1px solid #21262d;

    white-space:pre-wrap;

    word-break:break-all;

    max-height:400px;

    overflow:auto;

}


</style>

</head>


<body>


<h2>🔑 Account JSON Generator</h2>


<p>
Nhập dạng: user|pass hoặc user:pass
</p>



<textarea id="input" placeholder="acc1|123456
acc2:abcdef"></textarea>




<div class="upload-box">


<input 
type="file"
id="fileInput"
accept=".txt,.doc,.docx"
hidden
>



<label for="fileInput">


<div class="upload-icon">
📂
</div>


<div class="upload-title">
Chọn file tài khoản
</div>


<div class="upload-desc">
Hỗ trợ TXT, DOC, DOCX
</div>


</label>


</div>



<div id="fileName">
Chưa chọn file
</div>




<div class="button-group">


<button onclick="loadAcc()">
LOAD JSON
</button>


<button onclick="copyJSON()">
COPY JSON
</button>


<button onclick="downloadJSON()">
DOWNLOAD JSON
</button>


</div>




<h3>Kết quả:</h3>


<div id="count">
Số lượng acc: 0
</div>



<pre id="result">
Chưa có dữ liệu
</pre>





<script>


let jsonData="";




// UPLOAD FILE


document
.getElementById("fileInput")
.addEventListener("change",function(){



let file=this.files[0];


if(!file)return;



document.getElementById("fileName").textContent =
"📄 Đã chọn: " + file.name;





// TXT


if(file.name.toLowerCase().endsWith(".txt")){


let reader=new FileReader();



reader.onload=function(e){


document.getElementById("input").value=e.target.result;


}



reader.readAsText(file);



}





// DOC DOCX


else if(

file.name.toLowerCase().endsWith(".doc") ||

file.name.toLowerCase().endsWith(".docx")

){



let reader=new FileReader();



reader.onload=function(e){



mammoth.extractRawText({

arrayBuffer:e.target.result

})


.then(function(result){


document.getElementById("input").value=result.value;


});



}



reader.readAsArrayBuffer(file);



}




else{


alert("Chỉ hỗ trợ TXT, DOC, DOCX");


}



});







// CONVERT


function loadAcc(){



let text=
document.getElementById("input").value;



let lines=text

.split(/\r?\n/)

.map(x=>x.trim())

.filter(x=>x!="");



let accounts=[];




lines.forEach(line=>{


let data=line.split(/[|:]/);



if(data.length>=2){


accounts.push({

user:data[0].trim(),

pass:data.slice(1).join(":").trim()

});


}



});




jsonData=
JSON.stringify(accounts,null,4);



document.getElementById("result")
.textContent=jsonData;



document.getElementById("count")
.textContent=
"Số lượng acc: " + accounts.length;



}







function copyJSON(){



if(!jsonData){

alert("Chưa có dữ liệu!");

return;

}



navigator.clipboard.writeText(jsonData);


alert("Đã copy JSON!");



}








function downloadJSON(){



if(!jsonData){

alert("Chưa có dữ liệu!");

return;

}



let blob=new Blob(

[jsonData],

{
type:"application/json"
}

);



let a=document.createElement("a");



a.href=URL.createObjectURL(blob);



a.download="accounts.json";



a.click();



}



</script>


</body>
</html>
